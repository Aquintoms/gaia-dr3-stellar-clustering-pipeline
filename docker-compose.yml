services:
  gaia-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gaia-stellar-clustering-api:1.0.0
    container_name: gaia-stellar-clustering-api
    init: true
    restart: unless-stopped
    ports:
      # Keep the demo local to this computer by default.
      - "127.0.0.1:8000:8000"
    environment:
      GAIA_PROJECT_ROOT: /app
      GAIA_MODEL_DIR: MODEL
      GAIA_OUTPUT_DIR: OUTPUTS
      LOG_LEVEL: INFO
      # Numba must write its compiled-function cache to the writable tmpfs,
      # because the container root filesystem and model mounts are read-only.
      NUMBA_CACHE_DIR: /tmp/numba_cache
    volumes:
      # Keep large trained estimators and catalogue outside the image.
      - ./MODEL:/app/MODEL:ro
      - ./OUTPUTS:/app/OUTPUTS:ro
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
